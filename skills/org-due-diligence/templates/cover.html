<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Decision Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   SOFT EDITORIAL. Cream paper, ink text, pastels only as fills.
   Serif carries the voice; sans carries the substance. Light by design:
   it's a printed page, so it keeps its paper in dark mode too.
   ===================================================================== */
:root {
  --paper: #F2EEDF; --paper-2: #ECE6D2; --card: rgba(255,255,255,.55); --card-solid: #FBF9F2;
  --ink: #2A241B; --ink-soft: #5C5345; --ink-faint: #8A8171;
  --pink: #E1A4C2; --lemon: #D6DD63; --blush: #E8C9B6; --sage: #B7C7A8; --lilac: #C9BEDC;
  --rule: rgba(42,36,27,.18); --rule-2: rgba(42,36,27,.35);
  --serif: "Cormorant Garamond", Garamond, Georgia, serif;
  --sans: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gutter: clamp(16px, 5vw, 72px);
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
em { font-style: italic; }
.serif { font-family: var(--serif); font-weight: 500; }
.serif em { font-weight: 400; }

/* ---------- Sheets: one idea per page ---------- */
.sheet { max-width: 1240px; margin: 0 auto; padding: 56px var(--gutter) 72px; position: relative; }
.sheet + .sheet { border-top: 1px dashed var(--rule-2); }
.chrome { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 40px; }
.chrome .eyebrow { font-size: 17px; }
.chrome .num { font: italic 400 20px/1 var(--serif); color: var(--ink-soft); white-space: nowrap; }
.swatches { display: flex; gap: 10px; }
.swatches i { width: 30px; height: 30px; border-radius: 50%; display: block; }
h1, h2, h3 { margin: 0; font-family: var(--serif); font-weight: 500; letter-spacing: -.015em; text-wrap: balance; }
h2.title { font-size: clamp(44px, 6vw, 84px); line-height: .98; margin-bottom: 12px; }
h3 { font-size: 30px; line-height: 1.1; margin-bottom: 14px; }
.dek { font: italic 400 clamp(22px, 2.4vw, 30px)/1.25 var(--serif); color: var(--ink-soft); margin: 0 0 40px; max-width: 900px; }
.kicker { font: 500 13px/1.2 var(--sans); letter-spacing: .01em; color: var(--ink-soft); margin: 0 0 10px; }
.card { background: var(--card); border-radius: 24px; padding: 28px 30px; }
.muted { color: var(--ink-soft); }
.small { font-size: 14px; line-height: 1.5; }
.grid-2 { display: grid; gap: 24px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .grid-2 { grid-template-columns: 1.25fr .75fr; gap: 48px; } }

/* ---------- Pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 6px; border-radius: 999px;
  font: 500 12.5px/1 var(--sans); white-space: nowrap; background: var(--card-solid); }
.pill.verified { background: var(--lemon); }
.pill.reported { background: var(--blush); }
.pill.inferred { background: var(--lilac); }
.pill.unknown  { background: transparent; outline: 1.5px dashed var(--ink-soft); outline-offset: -1.5px; }
.pill.ink { background: var(--ink); color: var(--paper); }
.pill.fit { background: var(--card-solid); font-size: 14px; padding: 7px 14px 8px; }
.src { font-size: 12.5px; color: var(--ink-soft); }

/* ---------- Harvey balls: rating is shape + text, never color alone ---------- */
.hb { width: 22px; height: 22px; flex: none; display: inline-block; vertical-align: middle; }
.rating { display: inline-flex; align-items: center; gap: 8px; font: 500 14px/1 var(--sans); }

/* ======================= 1. COVER ======================= */
.cover-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: clamp(40px, 7vw, 88px); }
.cover-top .eyebrow { font-size: 17px; }
.cover h1 { font-size: clamp(60px, 11vw, 168px); line-height: .9; letter-spacing: -.025em; margin-bottom: 28px; }
.cover .dek { max-width: 820px; }
.short { display: grid; gap: 24px; grid-template-columns: 1fr; margin: 0 0 48px; }
@media (min-width: 900px) { .short { grid-template-columns: 220px 1fr; } }
.short .kicker { font: italic 400 26px/1.1 var(--serif); color: var(--ink); margin: 0; }
.short p { margin: 0; font: 500 clamp(22px, 2.2vw, 28px)/1.3 var(--serif); max-width: 860px; }
.options { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .options { grid-template-columns: repeat(var(--n), 1fr); } }
.opt { border-radius: 28px; padding: 26px 26px 24px; position: relative; display: flex; flex-direction: column; gap: 10px; }
.opt .name { font: 500 40px/1 var(--serif); letter-spacing: -.01em; }
.opt .role { font-size: 14.5px; line-height: 1.35; }
.opt .status { font: italic 400 19px/1.2 var(--serif); color: var(--ink-soft); }
.opt .note { font-size: 14.5px; line-height: 1.45; margin: 4px 0 0; }
.opt .stars { margin-top: auto; padding-top: 14px; border-top: 1px dashed var(--rule-2); display: grid; gap: 8px; }
.opt .stars div { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13.5px; }
.opt .lean { position: absolute; top: -12px; right: 20px; }
.inside { margin-top: 44px; display: flex; flex-wrap: wrap; gap: 8px 28px; font: italic 400 20px/1.3 var(--serif); color: var(--ink-soft); }
.inside a { color: inherit; text-decoration: none; border-bottom: 1px dashed var(--rule-2); }
.inside a:hover { color: var(--ink); }

/* ======================= 2. AT A GLANCE ======================= */
.matrix { display: grid; grid-template-columns: minmax(150px, 1.25fr) repeat(var(--n), minmax(0, 1fr)); align-items: stretch; }
.matrix > div { padding: 12px 10px; border-top: 1px dashed var(--rule); display: flex; align-items: center; }
.matrix .hd { border-top: 0; font: 500 24px/1.05 var(--serif); padding-bottom: 14px; align-items: flex-end; }
.matrix .hd span { border-radius: 999px; padding: 5px 14px 7px; white-space: nowrap; font-size: 22px; }
.matrix .sec { grid-column: 1 / -1; border-top: 0; padding: 18px 10px 4px; font: italic 400 19px/1 var(--serif); color: var(--ink-soft); }
.matrix .dim { font-size: 14.5px; font-weight: 500; line-height: 1.25; }
.matrix .cell { flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px; position: relative; cursor: default; }
.matrix .cell .why { display: none; font-size: 12.5px; line-height: 1.4; color: var(--ink-soft); }
.matrix.open .cell .why { display: block; }
.matrix .overall { font-weight: 600; border-top: 1.5px solid var(--ink); }
.matrix .cell.overall-cell { border-top: 1.5px solid var(--ink); }
.star { color: var(--ink); margin-right: 4px; }
.toggle { margin-top: 14px; border: 0; background: none; padding: 0; font: italic 400 19px/1 var(--serif); color: var(--ink-soft);
  border-bottom: 1px dashed var(--rule-2); cursor: pointer; }
.toggle:hover { color: var(--ink); }
.tip { position: fixed; z-index: 50; max-width: 300px; background: var(--ink); color: var(--paper); border-radius: 14px;
  padding: 10px 14px; font-size: 13px; line-height: 1.45; pointer-events: none; opacity: 0; transition: opacity .12s; }
.tip.show { opacity: 1; }
.matrix-wrap { overflow-x: auto; }
.matrix-wrap .matrix { min-width: 620px; }
.trade { font: 500 clamp(21px, 1.9vw, 25px)/1.3 var(--serif); margin: 0 0 32px; }
.trade::before { content: "\201C"; display: block; font-size: 90px; line-height: .6; height: 34px; color: var(--ink-faint); }
.flips { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; counter-reset: f; }
.flips li { background: var(--card); border-radius: 20px; padding: 18px 20px 18px 62px; position: relative; counter-increment: f; }
.flips li::before { content: counter(f); position: absolute; left: 18px; top: 14px; width: 32px; height: 32px; border-radius: 50%;
  background: var(--lemon); display: grid; place-items: center; font: 500 20px/1 var(--serif); }
.flips b { display: block; font: 600 20px/1.2 var(--serif); margin-bottom: 4px; }
.flips p { margin: 0 0 6px; font-size: 14.5px; }
.flips .ask { font-size: 13px; color: var(--ink-soft); }

/* ======================= 3. INSIDE THE ORG ======================= */
.org { position: relative; background: var(--card); border-radius: 28px; padding: 32px 20px 28px; margin-bottom: 28px; }
.org svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.tier { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px 22px; position: relative; z-index: 1; }
.tier + .tier { margin-top: 40px; }
@media (max-width: 700px) { .org svg.edges { display: none; } .tier + .tier { margin-top: 16px; } }
.node { background: var(--card-solid); border-radius: 18px; padding: 12px 16px 13px; min-width: 150px; max-width: 220px; text-align: center; }
.node .n { font: 600 19px/1.1 var(--serif); }
.node .r { font-size: 12.5px; line-height: 1.3; margin-top: 3px; }
.node .m { font: italic 400 15px/1.2 var(--serif); color: var(--ink-soft); margin-top: 4px; }
.node.you { background: var(--pink); outline: 2px solid var(--ink); outline-offset: 3px; }
.node.lead { background: var(--lemon); }
.node.peer { background: var(--sage); }
.node.team { background: var(--blush); }
.node.exit { background: transparent; outline: 1.5px dashed var(--ink-soft); outline-offset: -1.5px; }
.node.gap  { background: transparent; outline: 1.5px dashed var(--ink-soft); outline-offset: -1.5px; }
.node .flag { display: inline-block; margin-top: 7px; }
.org-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; margin-top: 24px; font-size: 12.5px; color: var(--ink-soft); }
.org-legend span { display: inline-flex; align-items: center; gap: 6px; }
.org-legend i { width: 14px; height: 14px; border-radius: 5px; display: inline-block; }
.standouts { display: grid; gap: 14px; }
.standout { border-top: 1px dashed var(--rule-2); padding-top: 14px; }
.standout:first-child { border-top: 0; padding-top: 0; }
.standout b { display: block; font: 600 21px/1.2 var(--serif); margin-bottom: 4px; }
.standout p { margin: 0 0 8px; font-size: 14.5px; }
.signals { display: grid; gap: 14px; grid-template-columns: 1fr; margin-top: 28px; }
@media (min-width: 760px) { .signals { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); } }
.signal { background: var(--card); border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; }
.signal .who { font-size: 12.5px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 8px; }
.signal .what { font: 500 20px/1.25 var(--serif); }
.bands { margin-top: 36px; }
.band-row { display: grid; grid-template-columns: 116px 1fr; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px dashed var(--rule); }
.band-row .lbl { font-size: 14px; line-height: 1.25; }
.band-row .lbl small { display: block; color: var(--ink-soft); font-size: 12px; }
.track { position: relative; height: 34px; }
.track .bar { position: absolute; top: 9px; height: 16px; border-radius: 4px; }
.track .val { position: absolute; top: -2px; font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; transform: translateY(-100%); }
.track .offer { position: absolute; top: 4px; width: 3px; height: 26px; background: var(--ink); border-radius: 2px; }
.track .offer span { position: absolute; left: 7px; top: 22px; font: italic 500 14px/1 var(--serif); white-space: nowrap; }
.axis { display: grid; grid-template-columns: 116px 1fr; gap: 14px; }
.axis .ticks { position: relative; height: 22px; border-top: 1px solid var(--rule-2); }
.axis .ticks span { position: absolute; top: 5px; transform: translateX(-50%); font-size: 11.5px; color: var(--ink-soft); }
.axis .ticks span:last-child { transform: translateX(-100%); }

/* ======================= 4. NEXT CONVERSATION ======================= */
.ask-card { background: var(--pink); border-radius: 32px; padding: clamp(28px, 4vw, 48px); margin-bottom: 24px; }
.ask-card .q { font: 500 clamp(28px, 3.2vw, 40px)/1.12 var(--serif); margin: 8px 0 0; letter-spacing: -.01em; }
.listen { display: grid; gap: 16px; grid-template-columns: 1fr; margin-bottom: 28px; }
@media (min-width: 760px) { .listen { grid-template-columns: 1fr 1fr; } }
.listen .card b { display: block; font: 600 20px/1.2 var(--serif); margin-bottom: 6px; }
.listen .good { background: var(--sage); }
.listen .bad  { background: transparent; outline: 1.5px dashed var(--ink-soft); outline-offset: -1.5px; }
.walk { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.walk li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; font-size: 15px; }
.walk li::before { content: "→"; font-family: var(--serif); font-size: 20px; line-height: 1.1; }
.script { font: italic 400 21px/1.35 var(--serif); margin: 8px 0 0; }
.timeline { position: relative; display: grid; gap: 18px; grid-template-columns: 1fr; margin-top: 12px; }
@media (min-width: 900px) {
  .timeline { grid-template-columns: repeat(var(--n), 1fr); gap: 14px; padding-top: 30px; }
  .timeline::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 2px; background: var(--rule-2); }
  .step::before { top: -30px !important; left: 0 !important; }
}
.step { position: relative; padding-left: 38px; }
@media (min-width: 900px) { .step { padding-left: 0; } }
.step::before { content: ""; position: absolute; left: 0; top: 2px; width: 26px; height: 26px; border-radius: 50%; background: var(--lemon); outline: 4px solid var(--paper); }
.step.key::before { background: var(--pink); }
.step .when { font: 600 22px/1 var(--serif); margin-bottom: 6px; }
.step p { margin: 0; font-size: 14px; line-height: 1.45; }

/* ======================= 5. HOW THIS WAS MADE ======================= */
.flow { position: relative; display: grid; gap: 22px; grid-template-columns: 1fr; }
@media (min-width: 1000px) { .flow { grid-template-columns: 1.1fr 1fr 1fr; gap: 72px; align-items: center; } }
.flow svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; display: none; }
@media (min-width: 1000px) { .flow svg.edges { display: block; } }
.flow-head { display: none; font: italic 400 20px/1 var(--serif); color: var(--ink-soft); margin-bottom: 14px; }
@media (min-width: 1000px) { .flow-head { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 72px; } }
.col { display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1; }
.col > .kicker { font: italic 400 20px/1 var(--serif); color: var(--ink-soft); margin: 0 0 4px; }
@media (max-width: 999px) { .col + .col::before { content: "↓"; font: 400 30px/1 var(--serif); color: var(--ink-faint); text-align: center; margin: -8px 0 4px; } }
.fn { background: var(--card-solid); border-radius: 16px; padding: 11px 14px 12px; }
.fn .t { font-weight: 500; font-size: 14.5px; line-height: 1.25; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.fn .t .c { font: 600 22px/1 var(--serif); }
.fn .d { font-size: 12.5px; color: var(--ink-soft); line-height: 1.35; margin-top: 3px; }
.fn.group { padding: 16px 18px 12px; }
.fn.group .gt { font: 600 22px/1 var(--serif); margin-bottom: 8px; }
.fn.group .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 0; border-top: 1px dashed var(--rule-2); }
.fn.group .row .t, .fn.group .row .d { grid-column: 1; }
.fn.group .row .c { grid-column: 2; grid-row: 1 / span 2; font: 600 26px/1 var(--serif); align-self: center; }
.fn.input { background: var(--blush); }
.fn.output { background: var(--card-solid); border: 1.5px solid var(--ink); }
.hat { border-radius: 22px; padding: 16px 18px 17px; }
.hat .hn { font: 600 26px/1 var(--serif); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.hat .hn small { font: 500 11.5px/1 var(--sans); color: var(--ink-soft); }
.hat .hd { font-size: 13.5px; line-height: 1.4; margin-top: 6px; }
.hat.researcher { background: var(--sage); }
.hat.strategist { background: var(--lilac); }
.hat.coach { background: var(--pink); }
.hat.check { background: var(--lemon); border-radius: 999px; padding: 11px 18px; }
.hat.check .hn { font-size: 20px; }
.hat.off { background: transparent; outline: 1.5px dashed var(--ink-soft); outline-offset: -1.5px; color: var(--ink-soft); }
.evals { margin-top: 48px; background: var(--card); border-radius: 28px; padding: clamp(22px, 3vw, 36px); }
.evals-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 24px; margin-bottom: 20px; }
.evals-head h3 { margin: 0; }
.ledger { display: flex; height: 44px; border-radius: 12px; overflow: hidden; gap: 2px; margin: 0 0 22px; }
.ledger div { display: grid; place-items: center; font: 600 18px/1 var(--serif); min-width: 32px; }
.eval-cols { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .eval-cols { grid-template-columns: repeat(4, 1fr); } }
.eval-col { border-top: 1px dashed var(--rule-2); padding-top: 14px; }
.eval-col .n { font: 600 40px/1 var(--serif); margin: 10px 0 6px; }
.eval-col p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.45; }
.eval-col .ex { font: italic 400 17px/1.3 var(--serif); color: var(--ink); }
.checks { font: italic 400 19px/1.3 var(--serif); color: var(--ink-soft); }

footer.foot { max-width: 1240px; margin: 0 auto; padding: 24px var(--gutter) 48px; display: flex; flex-wrap: wrap; justify-content: space-between;
  gap: 8px 24px; font: italic 400 17px/1.35 var(--serif); color: var(--ink-soft); border-top: 1px dashed var(--rule-2); }

@media print {
  .sheet { break-after: page; max-width: none; }
  .toggle { display: none; }
  .matrix .cell .why { display: block; }
}
@media (prefers-reduced-motion: no-preference) {
  .rise { animation: rise .8s cubic-bezier(.22,1,.36,1) var(--d, 0s) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
}
</style>
</head>
<body>
<main id="app"></main>
<footer class="foot" id="foot"></footer>
<div class="tip" id="tip" role="tooltip"></div>

<script>
/* =====================================================================
   EDIT ONLY THIS OBJECT. The pages render from it; never touch the layout.
   Fill it from THIS run's files: the brief, each dossier, the call sheet,
   and the run log (what was read, how each claim is labeled).
   eyebrow: for a real run, "Decision brief · v2 · Oct 3, 2026".
   Markup: *text* in any title renders in italic.
   Ratings: "high" | "medium" | "low" | "unknown"
   Overall: "high" | "medium" | "low" | "miss" | "early"
   Gates:   "pass" | "fail" | "unknown"
   Labels:  "verified" | "reported" | "inferred" | "unknown"
   The sample below is fictional.
   ===================================================================== */
const COVER = {
  eyebrow: "Illustrative copy · every company, person, and number is fictional",
  version: 1,
  headline: "A founder *or* a ladder?",
  question: "Which option puts you in a Head of Product seat within two years, with a team you'd be proud to lead?",
  bottomLine: "Leaning Company A, with conditions. It's the only path to the top product seat within two years, but only if the founder hands over product. You can find out before Thursday's call ends.",
  whatChanged: [],
  lean: 0,
  options: [
    { name: "Company A", role: "Director of Product · first product leader, exec seat", status: "Offer in hand",
      overall: "high", note: "Fastest route to the seat you want, if the founder truly lets go." },
    { name: "Company B", role: "Group PM · core platform, 30 engineers", status: "Offer in hand",
      overall: "medium", note: "Great job, wrong ladder: Director seats go to outside hires." },
    { name: "Stay", role: "Senior PM · same scope, strong manager", status: "Your current job", stay: true,
      overall: "low", note: "Safe and supported, but a shrinking org won't create the seat." }
  ],
  gates: [ { name: "Hybrid, 3 office days max", values: ["unknown", "pass", "pass"] } ],
  dimensions: [
    { name: "Path to next level", star: true, ratings: [
      { level: "high", note: "Top product seat now; 'grows into Head of' is the recruiter's phrase only [Reported]" },
      { level: "low", note: "Last two Director seats hired externally [Reported · LinkedIn]" },
      { level: "medium", note: "March cycle, but no Director seat open" } ] },
    { name: "Scope & team", star: true, ratings: [
      { level: "medium", note: "4 PMs, one likely internal candidate [Inferred]" },
      { level: "high", note: "Core platform, 30 engineers [Verified · hiring manager]" },
      { level: "medium", note: "Same scope, nothing new planned" } ] },
    { name: "Manager & reporting line", ratings: [
      { level: "medium", note: "The founder; no product leader to learn from" },
      { level: "high", note: "VP in seat 3 yrs, promoted two PMs this year [Reported · LinkedIn]" },
      { level: "high", note: "Strong advocate" } ] },
    { name: "Leadership & exec access", ratings: [
      { level: "high", note: "Exec-team seat [Verified · offer letter]" },
      { level: "medium", note: "Product reports through the CTO" },
      { level: "medium", note: "Two layers from the execs" } ] },
    { name: "Org health & momentum", ratings: [
      { level: "medium", note: "Series B 14 months ago; product team 6 → 11" },
      { level: "high", note: "Hiring up; profitable per the CFO [Reported · press]" },
      { level: "low", note: "Product down ~10%; two leaders left" } ] },
    { name: "Economics", ratings: [
      { level: "medium", note: "Mid-band base; large, illiquid equity" },
      { level: "high", note: "Top of band; tenders in 2024 and 2025" },
      { level: "medium", note: "Refresh in March" } ] },
    { name: "Ways of working", ratings: [

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Harvey ball: full = High, half = Medium, quarter = Low, dashed = unknown */
function hb(level) {
  const r = 10, c = 11;
  const ring = `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--ink)" stroke-width="1.5"${level === "unknown" ? ' stroke-dasharray="3 3"' : ""}/>`;
  const wedge = f => `<path d="M${c} ${c} L${c} ${c - r} A${r} ${r} 0 ${f > .5 ? 1 : 0} 1 ${c + r * Math.sin(2 * Math.PI * f)} ${c - r * Math.cos(2 * Math.PI * f)} Z" fill="var(--ink)"/>`;
  const inner = level === "high" ? `<circle cx="${c}" cy="${c}" r="${r}" fill="var(--ink)"/>` : level === "medium" ? wedge(.5) : level === "low" ? wedge(.25) : "";
  return `<svg class="hb" viewBox="0 0 22 22" aria-hidden="true">${inner}${ring}</svg>`;
}

    const A = a.getBoundingClientRect(), B = b.getBoundingClientRect();
    let p;
    if (opts.vertical || Math.abs((A.left + A.width / 2) - (B.left + B.width / 2)) < 40) {
      const x1 = A.left + A.width / 2 - hb.left, y1 = A.bottom - hb.top, x2 = B.left + B.width / 2 - hb.left, y2 = B.top - hb.top, ym = (y1 + y2) / 2;
      p = opts.vertical ? `M${x1} ${y1} V${ym} H${x2} V${y2}` : `M${x1} ${y1} V${y2}`;
    } else {
      const x1 = A.right - hb.left, y1 = A.top + A.height / 2 - hb.top, x2 = B.left - hb.left, y2 = B.top + B.height / 2 - hb.top, k = (x2 - x1) * .5;
      p = `M${x1} ${y1} C${x1 + k} ${y1} ${x2 - k} ${y2} ${x2} ${y2}`;
    }
    d += `<path d="${p}" fill="none" stroke="var(--ink-soft)" stroke-width="1.5"${style === "dash" ? ' stroke-dasharray="4 5"' : ""} opacity=".7"/>`;
  });
  svg.innerHTML = d;
}
function drawAll() {
  const org = document.getElementById("orgchart"), q = s => org.querySelector(`[data-node="${s}"]`);
  connect(org, (o.edges || []).map(([t1, n1, t2, n2]) => {
    const child = o.tiers[t2][n2];

  pairs.push([f("researcher"), f("check")], [f("check"), f("strategist")], [f("strategist"), f("coach"), on("coach") ? "" : "dash"]);
  R.outputs.forEach((out, i) => pairs.push([f(out.hat === "researcher" ? "check" : out.hat), f(`out${i}`)]));
  pairs.push([f("coach"), f("outc")]);
  connect(flow, pairs.filter(p => p[0] && p[1]));
}
const redraw = () => requestAnimationFrame(drawAll);
Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1200))]).then(() => { drawAll(); setTimeout(drawAll, 900); });
addEventListener("resize", redraw);
</script>
